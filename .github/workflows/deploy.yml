name: Build & Push to ACR

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}
  ACR_SERVER: ${{ vars.ACR_SERVER }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    environment: Azure-ACR-gubiii

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/gastosin-frontend:${{ env.IMAGE_TAG }}
            ${{ env.ACR_SERVER }}/gastosin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/gastosin-backend:${{ env.IMAGE_TAG }}
            ${{ env.ACR_SERVER }}/gastosin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
